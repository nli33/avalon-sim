[project]
name = "avalon-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "rich"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
avalon = "avalon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avalon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
